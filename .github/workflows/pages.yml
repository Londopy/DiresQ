name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Needed by deploy-pages. Without these the deploy step 403s and the error
# does not say why.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel one halfway: an interrupted deploy can
# leave the site serving a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here. Caching keys off a lockfile, and setup-node
      # fails outright when it can't find one rather than skipping the cache.
      # Add it back once site/package-lock.json is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci is stricter and faster, but it needs a lockfile. Until one is
      # committed, fall back rather than failing the whole deploy.
      - name: Install
        working-directory: site
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No lockfile yet — using npm install."
            npm install --no-audit --no-fund
          fi

      # sync-docs copies ../docs into src/pages, so the site can never drift
      # from the docs in the repo.
      - name: Build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
