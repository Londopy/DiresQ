name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The only failures worth stopping a push for.
  blocking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed database
        run: |
          if git ls-files | grep -Ei '\.(db|sqlite3?)$'; then
            echo "::error::a database file is tracked in git"
            exit 1
          fi
          echo "no tracked database"

      # Python rather than grep: the patterns need both quote characters,
      # which is unescapable inside a YAML block scalar.
      - name: No hardcoded secrets or weak randomness
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          CHECKS = [
              (re.compile(r"""SECRET_KEY["']?\s*[=:]\s*["'][^"']+"""),
               "SECRET_KEY is assigned a literal; read it from the environment"),
              (re.compile(r"""\brandom\.(random|randint|choice|choices|getrandbits)\b"""),
               "use the secrets module for anything token-shaped, not random"),
          ]
          SKIP = {".venv", "venv", ".git", "tests"}

          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if SKIP & set(path.parts):
                  continue
              lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
              for n, line in enumerate(lines, 1):
                  for pattern, message in CHECKS:
                      if pattern.search(line):
                          print(f"::error file={path},line={n}::{message}")
                          failed = True

          if failed:
              sys.exit(1)
          print("no hardcoded secrets, no weak randomness")
          EOF

  # Reported to the job summary, never blocking.
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install bandit pip-audit

      - name: Bandit
        continue-on-error: true
        run: |
          echo '### Bandit' >> "$GITHUB_STEP_SUMMARY"
          bandit -r . -x ./tests,./.venv -f txt 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY"

      - name: pip-audit
        continue-on-error: true
        run: |
          echo '### pip-audit' >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r requirements.txt 2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY"

      - name: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
