name: Release

# Fires on a version tag. Builds the notes from CHANGELOG.md rather than from
# commit subjects, because the changelog is written for humans and a list of
# commit messages is not.
#
#     patchnotes CHANGELOG.md bump 1.0.0
#     git tag v1.0.0 && git push --tags
#
# If the Zenodo integration is switched on for this repo, publishing the
# release is also what mints the DOI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build notes for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt patchnotes==2.4.0

      # A tagged release that doesn't pass its own tests is worse than no
      # release, because it's the version people will actually download.
      - name: Tests
        run: pytest -q

      - name: Validate CHANGELOG.md
        run: patchnotes CHANGELOG.md validate --strict

      - name: Pull the notes for this version out of the changelog
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          python - "$VERSION" <<'PY' > release-notes.md
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          # Everything between this version's heading and the next one.
          pattern = rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)"
          found = re.search(pattern, text, re.M | re.S)

          if found:
              print(found.group(1).strip())
          else:
              # Don't invent notes. Say the section is missing and point at
              # the file, so a wrong release is obvious rather than plausible.
              print(f"No `## [{version}]` section in CHANGELOG.md.")
              print()
              print("See [CHANGELOG.md](CHANGELOG.md).")
          PY
          echo "Built notes for $VERSION"

      # One-file launchers, attached to the release so somebody can run this
      # without cloning anything. They are shell scripts, not binaries: there
      # is nothing compiled in this project, so there is nothing to
      # cross-compile and no macOS or Windows runner in this workflow. The
      # whole step is a few seconds on the ubuntu runner that is already here,
      # which is also why it cannot sit in a queue waiting for a macOS box.
      - name: Stamp the launchers with this version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for f in diresq-macos-linux.sh diresq-windows.ps1; do
            sed "s/__VERSION__/${TAG}/g" "scripts/$f" > "dist/$f"
          done
          chmod +x dist/diresq-macos-linux.sh

          # Prove the stamp landed. A launcher that still says __VERSION__
          # silently falls back to main, which is not what a release means.
          for f in dist/*; do
            if grep -q "__VERSION__" "$f"; then
              echo "::error::$f still contains __VERSION__"
              exit 1
            fi
          done

      - name: Check the launchers are syntactically valid
        run: |
          bash -n dist/diresq-macos-linux.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq powershell 2>/dev/null || true
          if command -v pwsh >/dev/null; then
            pwsh -NoProfile -Command "
              \$e = \$null
              [System.Management.Automation.Language.Parser]::ParseFile(
                'dist/diresq-windows.ps1', [ref]\$null, [ref]\$e) > \$null
              if (\$e) { \$e | ForEach-Object { Write-Host \$_ }; exit 1 }
              Write-Host 'diresq-windows.ps1 parses'"
          else
            echo "pwsh unavailable on this runner; skipping the PowerShell parse check"
          fi

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          files: |
            dist/diresq-macos-linux.sh
            dist/diresq-windows.ps1
            dist/SHA256SUMS.txt
