<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/signup.css">
    <title>Sign Up</title>
</head>
<body>

<div class="container">

    <div class="left-panel">
        <div class="hero">

            <img src="../static/images/DiresQ.png" alt="DiresQ Logo" class="logo-placeholder">

            <h1>DiresQ</h1>
            <p>Join the community and help report disasters faster.</p>

        </div>
    </div>

    <div class="right-panel">

        <form action="/signup" method="POST" class="login-card">

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <ul class="flashes">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}

            <h2>Create Account</h2>

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Log In</a>
            </p>

        </form>

    </div>

</div>

<script src="../static/scripts/signup.js"></script>

</body>
</html>
