<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/report_make.css">
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">
    <title>Create Report</title>
</head>
<body>

<div class="container">

    <a href="/" class="back-btn">
        ← Back
    </a>

    <form action="/report/new" method="POST" class="report-card">


{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class="flashes">
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}
        <h1>Create Report</h1>

        <label>Subject</label>
        <input
            type="text"
            name="subject"
            placeholder="Ex: Flood in Location"
            required
        >

        <label>Priority</label>

        <select name="priority" required>

            <option value="" disabled selected>
                Select Priority
            </option>

            <option value="HIGH">
                HIGH
            </option>

            <option value="MEDIUM">
                MEDIUM
            </option>

            <option value="LOW">
                LOW
            </option>

        </select>

        <label>Location</label>

        <div class="location-tools">

            <button
                type="button"
                id="myLocation"
                class="location-btn">

                📍 Use My Location

            </button>

        </div>

        <div id="map"></div>

        <p id="locationText">
            Click on the map to select a location.
        </p>

        <input
            type="hidden"
            id="lat"
            name="lat"
            required>

        <input
            type="hidden"
            id="lng"
            name="lng"
            required>

        <label>Description</label>

        <textarea
            name="description"
            rows="10"
            placeholder="Describe the situation..."
            required
        ></textarea>

        <button type="submit" class="submit-btn">
            Submit Report
        </button>

    </form>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="../static/scripts/report_make.js"></script>

</body>
</html>
