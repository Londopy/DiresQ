<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/login.css">
    <title>Login Page</title>
</head>
<body>

<div class="container">

    <div class="left-panel">
        <div class="hero">

            
            <img class="logo-placeholder" src="../static/images/DiresQ.png" alt="DiresQ Icon">
            

            <h1>DiresQ</h1>
            <p>
                Fast. Reliable. Community Powered.
            </p>

        </div>
    </div>

    <div class="right-panel">

        <form action="/login" method="POST" class="login-card">

            <h2>Login</h2>

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

<script src="../static/scripts/login.js"></script>
</body>
</html>
